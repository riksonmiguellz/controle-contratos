<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Controle de Contratos · Fortuna AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F5FA; --panel:#FFFFFF; --panel-2:#FBFAFD; --ink:#191526; --ink-soft:#5B5470;
  --line:#E7E3F0; --line-strong:#D8D2E6;
  --violet:#6D3BF5; --violet-soft:#8B63FF; --violet-tint:#F0EAFF; --navy:#1C2E4A;
  --ok:#12A150; --ok-tint:#E5F5EC; --warn:#C67C00; --warn-tint:#FBF0DC;
  --crit:#D62F2F; --crit-tint:#FBE6E6; --info:#2563C9; --info-tint:#E5EEFB;
  --shadow:0 1px 2px rgba(25,21,38,.06),0 8px 24px rgba(25,21,38,.06); --radius:14px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0C0913; --panel:#151021; --panel-2:#1B1530; --ink:#F3F0FA; --ink-soft:#A79FBE;
  --line:#271F3D; --line-strong:#352A50; --violet:#9D7BFF; --violet-soft:#B399FF; --violet-tint:#221838; --navy:#9FB4D6;
  --ok:#3DD07E; --ok-tint:#12271C; --warn:#F0B24B; --warn-tint:#2E2411; --crit:#FF6B6B; --crit-tint:#301518; --info:#6BA5FF; --info-tint:#122238;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
}}
:root[data-theme="light"]{--bg:#F6F5FA;--panel:#FFFFFF;--panel-2:#FBFAFD;--ink:#191526;--ink-soft:#5B5470;--line:#E7E3F0;--line-strong:#D8D2E6;--violet:#6D3BF5;--violet-soft:#8B63FF;--violet-tint:#F0EAFF;--navy:#1C2E4A;--ok:#12A150;--ok-tint:#E5F5EC;--warn:#C67C00;--warn-tint:#FBF0DC;--crit:#D62F2F;--crit-tint:#FBE6E6;--info:#2563C9;--info-tint:#E5EEFB;--shadow:0 1px 2px rgba(25,21,38,.06),0 8px 24px rgba(25,21,38,.06);}
:root[data-theme="dark"]{--bg:#0C0913;--panel:#151021;--panel-2:#1B1530;--ink:#F3F0FA;--ink-soft:#A79FBE;--line:#271F3D;--line-strong:#352A50;--violet:#9D7BFF;--violet-soft:#B399FF;--violet-tint:#221838;--navy:#9FB4D6;--ok:#3DD07E;--ok-tint:#12271C;--warn:#F0B24B;--warn-tint:#2E2411;--crit:#FF6B6B;--crit-tint:#301518;--info:#6BA5FF;--info-tint:#122238;--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"Inter","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;letter-spacing:-.015em;text-wrap:balance;font-family:"Montserrat","Inter",system-ui,sans-serif;font-weight:700}
.brand,.bd,.brand-dot,.pill-role,.kpi .lab,.eyebrow{font-family:"Montserrat","Inter",system-ui,sans-serif}
/* ===== FORTUNA AI — identidade premium ===== */
@media (prefers-color-scheme:dark){:root{--bg:#0A0616;--panel:#150D28;--panel-2:#1C1236;--line:#2A1E45;--line-strong:#3A2A5C;}}
:root[data-theme="dark"]{--bg:#0A0616;--panel:#150D28;--panel-2:#1C1236;--line:#2A1E45;--line-strong:#3A2A5C;}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--violet);opacity:.9;margin-bottom:14px}
.brand-dot,.bd{background:linear-gradient(140deg,#8B63FF,#6D3BF5 45%,#3A1D8C);box-shadow:0 6px 22px -4px color-mix(in srgb,var(--violet) 70%,transparent),inset 0 1px 0 rgba(255,255,255,.25)}
.gate{position:relative;overflow:hidden}
.gate::before{content:"";position:absolute;top:-30%;left:50%;transform:translateX(-50%);width:680px;height:520px;
  background:radial-gradient(closest-side,color-mix(in srgb,var(--violet) 30%,transparent),transparent 70%);pointer-events:none;filter:blur(10px)}
.gate-card{position:relative;z-index:1}
:root[data-theme="dark"] .gate-card,@media(prefers-color-scheme:dark){.gate-card{box-shadow:0 20px 60px -18px rgba(109,59,245,.45),0 1px 0 rgba(255,255,255,.04) inset}}
.kpi.accent{background:linear-gradient(135deg,#7C4DFF,#5A2CC9 55%,#231152);box-shadow:0 14px 34px -12px color-mix(in srgb,var(--violet) 65%,transparent)}
.wordmark{font-family:"Montserrat",sans-serif;font-weight:800;letter-spacing:.02em}
.wordmark b{color:var(--violet)}
/* ===== tela de acesso (clara, command-center) ===== */
#bgfx{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:0}
.gate{background:radial-gradient(120% 90% at 50% -10%, #F1EBFF 0%, #F7F6FB 55%, #EEEAF8 100%)}
.gate::before{display:none}
.gate-card{position:relative;z-index:2;background:rgba(255,255,255,.82);backdrop-filter:blur(14px) saturate(1.1);border:1px solid rgba(109,59,245,.14);box-shadow:0 24px 70px -26px rgba(109,59,245,.32), 0 2px 10px rgba(25,21,38,.05)}
/* facepile da equipe */
.gate-user{display:flex;align-items:center;gap:11px;margin:4px 0 12px;padding:10px 12px;border:1px solid color-mix(in srgb,var(--violet) 25%,var(--line));border-radius:12px;background:var(--violet-tint)}
.gate-user .avatar{width:42px;height:42px;flex-shrink:0}
.gate-user .gu-info{min-width:0;text-align:left}
.gate-user .gu-nome{font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gate-user .gu-mail{font-size:12px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gate-team{margin-top:20px;border-top:1px solid var(--line);padding-top:16px}
.gate-team-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);font-weight:700;margin-bottom:11px;display:flex;align-items:center;gap:7px;justify-content:center}
.gate-avatars{display:flex;flex-wrap:wrap;justify-content:center;gap:0}
.gate-avatars .ga{width:38px;height:38px;border-radius:50%;border:2px solid #fff;margin-left:-9px;background:var(--violet-tint);color:var(--violet);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;overflow:hidden;font-family:"Montserrat",sans-serif;box-shadow:0 2px 7px rgba(25,21,38,.14);transition:transform .15s ease}
.gate-avatars .ga:first-child{margin-left:0}
.gate-avatars .ga:hover{transform:translateY(-3px) scale(1.06);z-index:3}
.gate-avatars .ga img{width:100%;height:100%;object-fit:cover}
.gate-avatars .ga.more{background:var(--violet);color:#fff;font-size:12px}
/* nuvem viva */
.cloud-dot{width:8px;height:8px;border-radius:50%;background:var(--ink-soft);display:inline-block;flex-shrink:0}
.mode-tag.cloud-on{border-color:rgba(18,161,80,.35);color:#0b7a3e;background:rgba(18,161,80,.10)}
.mode-tag.cloud-on .cloud-dot{background:#12A150;animation:pulseDot 1.8s infinite}
.mode-tag.cloud-off{border-color:rgba(214,47,47,.30);color:var(--crit);background:var(--crit-tint)}
.mode-tag.cloud-off .cloud-dot{background:var(--crit)}
#gate .mode-tag{animation:floaty 3.4s ease-in-out infinite}
@keyframes pulseDot{0%{box-shadow:0 0 0 0 rgba(18,161,80,.5)}70%{box-shadow:0 0 0 7px rgba(18,161,80,0)}100%{box-shadow:0 0 0 0 rgba(18,161,80,0)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
button{font-family:inherit;cursor:pointer}
.mono{font-variant-numeric:tabular-nums}
.hidden{display:none !important}
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.gate-card{width:100%;max-width:452px;background:var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:38px 34px;text-align:center}
.brand-dot{width:46px;height:46px;border-radius:13px;margin:0 auto 18px;background:linear-gradient(135deg,var(--violet),var(--navy));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:20px}
.gate h1{font-size:22px;margin-bottom:6px}
.gate .sub{color:var(--ink-soft);font-size:14px;margin-bottom:24px}
.gate .roles{display:flex;flex-direction:column;gap:12px}
.role-btn{border:1px solid var(--line-strong);background:var(--panel-2);color:var(--ink);border-radius:12px;padding:15px 16px;text-align:left;display:flex;gap:13px;align-items:center;transition:.15s}
.role-btn:hover{border-color:var(--violet);background:var(--violet-tint)}
.role-btn .ic{font-size:20px}
.role-btn .t{font-weight:650}
.role-btn .d{font-size:12.5px;color:var(--ink-soft)}
.pw-row{display:none;margin-top:14px;flex-direction:column;gap:8px}
.pw-row.show{display:flex}
.loginform{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.loginform .btn{width:100%;padding:13px}
.linkbtn{background:none;border:none;color:var(--violet);font-weight:600;font-size:13px;cursor:pointer;padding:8px;font-family:inherit;margin-top:6px}
.linkbtn:hover{text-decoration:underline}
input,select,textarea{font-family:inherit;font-size:14.5px;color:var(--ink);background:var(--panel-2);border:1px solid var(--line-strong);border-radius:10px;padding:11px 12px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--violet);outline-offset:1px;border-color:var(--violet)}
.btn{border:1px solid transparent;border-radius:10px;padding:11px 16px;font-weight:650;font-size:14px;background:var(--violet);color:#fff;transition:.15s;white-space:nowrap}
.btn:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line-strong)}
.btn.ghost:hover{border-color:var(--violet);color:var(--violet)}
.btn.sm{padding:7px 11px;font-size:13px}
.btn.danger{background:var(--crit)}
.err{color:var(--crit);font-size:13px;margin-top:10px;min-height:16px}
.mode-tag{display:inline-flex;gap:6px;align-items:center;font-size:11.5px;font-weight:650;padding:4px 10px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line-strong);color:var(--ink-soft);margin-bottom:18px}
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--panel) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:12px 22px;flex-wrap:wrap}
.topbar .brand{display:flex;align-items:center;gap:11px;font-weight:750}
.topbar .brand .bd{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--violet),var(--navy));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:15px}
.topbar .spacer{flex:1}
.pill-role{font-size:12px;font-weight:650;padding:5px 11px;border-radius:999px;background:var(--violet-tint);color:var(--violet);border:1px solid color-mix(in srgb,var(--violet) 30%,transparent)}
.pill-mode{font-size:11.5px;font-weight:650;padding:5px 10px;border-radius:999px;border:1px solid var(--line-strong);color:var(--ink-soft)}
.userbadge{display:flex;align-items:center;gap:8px;padding:4px 10px 4px 5px;border-radius:999px;background:var(--violet-tint);border:1px solid color-mix(in srgb,var(--violet) 28%,transparent);max-width:200px}
.userbadge.hidden{display:none}
.userbadge .avatar{width:28px;height:28px;font-size:11px}
.userbadge .ub-info{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.userbadge .ub-nome{font-weight:700;font-size:12.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.userbadge .ub-role{font-size:10px;font-weight:650;letter-spacing:.03em;text-transform:uppercase;color:var(--violet)}
.wrap{max-width:1180px;margin:0 auto;padding:22px 22px 80px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:15px 16px;box-shadow:var(--shadow)}
.kpi .lab{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);font-weight:650}
.kpi .val{font-size:22px;font-weight:750;margin-top:6px;letter-spacing:-.02em}
.kpi .val.small{font-size:18px}
.kpi .sub{font-size:12px;color:var(--ink-soft);margin-top:3px}
.kpi.accent{background:linear-gradient(135deg,var(--violet),var(--navy));border:none;color:#fff}
.kpi.accent .lab,.kpi.accent .sub{color:rgba(255,255,255,.82)}
.viewnav{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.viewnav button{background:var(--panel);border:1px solid var(--line-strong);border-radius:11px;padding:10px 16px;font-weight:650;font-size:14px;color:var(--ink-soft);font-family:inherit;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:7px}
.viewnav button:hover{border-color:var(--violet);color:var(--violet)}
.viewnav button.active{background:var(--violet);border-color:var(--violet);color:#fff;box-shadow:0 8px 18px -8px rgba(109,59,245,.55)}
#despWrap,#fluxoWrap,#agendaWrap,#alertWrap,#projWrap{display:none}
/* qualquer aba != Contratos esconde a home (kpis, busca, lista, equipe) */
body[class*="view-"] .kpis,body[class*="view-"] .toolbar,body[class*="view-"] #list,body[class*="view-"] #membrosWrap,body[class*="view-"] #atribWrap{display:none}
body.view-financeiro #despWrap,body.view-financeiro #fluxoWrap{display:block}
body.view-financeiro #despWrap{margin-bottom:22px}
body.view-agenda #agendaWrap{display:block}
body.view-foco #alertWrap{display:block}
.agenda-frame{width:100%;height:72vh;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.agenda-frame iframe{width:100%;height:100%;border:0}
/* ===== view PROJETOS (command center embutido) ===== */
body.view-projetos #alertWrap,body.view-projetos #membrosWrap,body.view-projetos #atribWrap,body.view-projetos .kpis,body.view-projetos .toolbar,body.view-projetos #list,body.view-projetos #agendaWrap,body.view-projetos #despWrap,body.view-projetos #fluxoWrap{display:none}
body.view-projetos #projWrap{display:block}
.pj-layout{display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:start}
.pj-side{display:flex;flex-direction:column;gap:8px;max-height:80vh;overflow:auto;padding-right:2px}
.pj-item{text-align:left;background:var(--panel);border:1px solid var(--line-strong);border-radius:12px;padding:12px 14px;cursor:pointer;font-family:inherit;transition:.15s;display:flex;flex-direction:column;gap:7px}
.pj-item:hover{border-color:var(--violet)}
.pj-item.active{border-color:var(--violet);box-shadow:0 8px 20px -10px rgba(109,59,245,.5);background:linear-gradient(180deg,rgba(109,59,245,.06),transparent)}
.pj-item .pj-name{font-weight:700;font-size:14.5px;color:var(--ink)}
.pj-item .pj-badges{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pj-b{font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px}
.pj-b.cc{background:rgba(109,59,245,.12);color:var(--violet)}
.pj-b.dr{background:#eef2f7;color:#475569}
.pj-main{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-height:60vh;display:flex;flex-direction:column}
.pj-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.pj-head h3{margin:0;font-size:16px;color:var(--ink)}
.pj-sub{font-size:12.5px;color:var(--ink-soft);margin-top:3px}
.pj-sub code{background:#f1f5f9;padding:1px 6px;border-radius:5px}
.pj-frame{flex:1;width:100%;min-height:70vh;background:#0b1020}
.pj-frame iframe{width:100%;height:100%;min-height:70vh;border:0;display:block}
.pj-fallback{padding:9px 16px;font-size:12px;color:var(--ink-soft);border-top:1px solid var(--line);background:#fafbfe}
.pj-nocc{padding:40px 20px;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center;color:var(--ink-soft)}
.pj-nocc .cc-open{font-size:15px}
@media(max-width:820px){.pj-layout{grid-template-columns:1fr}.pj-side{max-height:none;flex-direction:row;overflow-x:auto}.pj-item{min-width:180px}.pj-frame,.pj-frame iframe{min-height:60vh}}
.agenda-warn{margin:0 0 12px;padding:10px 13px;border-radius:10px;background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;font-size:13px;line-height:1.5}
.agenda-help{margin-top:10px;font-size:13px}
.agenda-help summary{cursor:pointer;font-weight:650;color:var(--violet)}
.agenda-help code{background:var(--violet-tint);padding:1px 5px;border-radius:5px;font-size:12px}
.agenda-edit{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.agenda-edit input{flex:1;min-width:220px}
.viewnav .nav-acao{border-style:dashed;color:var(--violet);border-color:color-mix(in srgb,var(--violet) 40%,transparent)}
.viewnav .nav-acao:hover{background:var(--violet-tint)}
.val-pos{color:var(--ok)}
.val-neg{color:var(--crit)}
.fx-chart{display:flex;gap:6px;align-items:flex-end;height:220px;padding:14px 4px 6px;border-bottom:1px solid var(--line);overflow-x:auto}
.fx-col{flex:1;min-width:52px;display:flex;flex-direction:column;align-items:center;gap:7px;height:100%;border-radius:10px;padding:6px 2px;transition:background .16s ease}
.fx-col:hover{background:var(--violet-tint)}
.fx-val{font-size:10.5px;font-weight:800;color:var(--violet);opacity:0;transform:translateY(4px);transition:.16s;white-space:nowrap;font-variant-numeric:tabular-nums}
.fx-col:hover .fx-val{opacity:1;transform:translateY(0)}
.fx-col.fx-neg .fx-val{color:var(--crit)}
.fx-bars{flex:1;display:flex;gap:4px;align-items:flex-end;width:100%;justify-content:center}
.fx-bars i{width:13px;border-radius:5px 5px 2px 2px;display:block;min-height:3px;transform-origin:bottom;animation:fxGrow .6s cubic-bezier(.2,.75,.2,1) both;animation-delay:var(--d,0s);transition:filter .16s ease}
.fx-col:hover .fx-bars i{filter:brightness(1.12) saturate(1.1)}
.fx-rec{background:linear-gradient(180deg,var(--violet-soft),var(--violet));box-shadow:0 3px 10px -3px color-mix(in srgb,var(--violet) 60%,transparent)}
.fx-des{background:linear-gradient(180deg,color-mix(in srgb,var(--crit) 45%,#fff),var(--crit));box-shadow:0 3px 10px -3px color-mix(in srgb,var(--crit) 45%,transparent)}
.fx-lbl{font-size:10.5px;color:var(--ink-soft);font-weight:700;white-space:nowrap;text-transform:capitalize}
.fx-legend{display:flex;gap:16px;font-size:12px;color:var(--ink-soft);margin-top:14px;flex-wrap:wrap;align-items:center}
.fx-k{display:inline-block;width:11px;height:11px;border-radius:4px;vertical-align:middle;margin-right:6px}
/* --- financeiro gerencial --- */
.fxbar{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-end;padding:2px 0 16px;border-bottom:1px solid var(--line);margin-bottom:16px}
.fxbar-grp{display:flex;flex-direction:column;gap:5px}
.fxbar-lab{font-size:11px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.03em}
.fxbar-suf{align-self:center;color:var(--ink-soft);font-size:12px;margin-left:-6px}
.fxseg{display:inline-flex;background:var(--panel-2);border:1px solid var(--line-strong);border-radius:10px;padding:3px;gap:2px}
.fxseg button{border:0;background:transparent;color:var(--ink-soft);font-family:inherit;font-weight:650;font-size:12.5px;padding:6px 12px;border-radius:8px;cursor:pointer;transition:.14s}
.fxseg button:hover{color:var(--violet)}
.fxseg button.active{background:var(--violet);color:#fff;box-shadow:0 6px 14px -7px var(--violet)}
.fxinput{background:var(--panel-2);border:1px solid var(--line-strong);border-radius:9px;padding:7px 10px;font-size:13.5px;color:var(--ink);font-family:inherit;width:130px}
.fxinput:focus{outline:0;border-color:var(--violet)}
.fxkpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:6px}
.fxkpi{background:var(--panel-2);border:1px solid var(--line);border-radius:13px;padding:13px 14px}
.fxkpi.pos{border-color:color-mix(in srgb,var(--ok) 35%,var(--line))}
.fxkpi.neg{border-color:color-mix(in srgb,var(--crit) 35%,var(--line))}
.fxk-lab{font-size:11.5px;color:var(--ink-soft);font-weight:650;margin-bottom:5px}
.fxk-val{font-size:19px;font-weight:800;letter-spacing:-.01em}
.fxk-sub{font-size:11px;color:var(--ink-soft);margin-top:3px}

.ccard{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 17px 13px;cursor:pointer;display:flex;flex-direction:column;gap:10px;transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease;position:relative}

/* ---------- derived ---------- */
const isDone=st=>st==="concluida"||st==="entregue";
const STAGE_WEIGHT={pendente:0,andamento:0.5,concluida:1,entregue:1}; // "Em andamento" conta meio caminho
function autoProgress(c){const es=c.etapas||[];if(!es.length)return 0;const soma=es.reduce((a,e)=>a+(STAGE_WEIGHT[e.status]||0),0);return Math.round(soma/es.length*100);}
function progress(c){ if(c.autoProgresso===false && c.progressoManual!=null && c.progressoManual!=="") return Math.max(0,Math.min(100,+c.progressoManual)); return autoProgress(c); }
const getFin=c=>c.fin||{valorTotal:0,valorMensal:0,parcelas:[],despesas:[]};
function recebido(c){return getFin(c).parcelas.filter(p=>p.pago).reduce((s,p)=>s+(+p.valor||0),0);}
function aReceber(c){return getFin(c).parcelas.filter(p=>!p.pago).reduce((s,p)=>s+(+p.valor||0),0);}
function despesaTotal(c){return getFin(c).despesas.reduce((s,d)=>s+(+d.valor||0),0);}
function temVencido(c){const t=todayISO();return getFin(c).parcelas.some(p=>!p.pago&&p.venc&&p.venc<t);}
function statusEfetivo(c){
  if(c.status==="encerrado")return "encerrado";
  if(c.status==="negociacao")return "negociacao";
  if(c.status==="pausado")return "pausado";
  if(ROLE==="gestao"&&temVencido(c))return "atrasado";
  const p=progress(c); if(p>0&&p<100)return "andamento";
  return c.status||"ativo";
}
function diasAte(iso){ if(!iso)return null; const d=parseISO(iso); if(!d||isNaN(d))return null; return Math.round((d-parseISO(todayISO()))/86400000); }
function etapaAtrasada(e){ return e && e.prazo && !isDone(e.status) && e.prazo < todayISO(); }
function buildAlertas(){
  const list=[];
  DB.concat(PROJ_ONLY).forEach(c=>{
    const _s=statusEfetivo(c); if(_s==="encerrado"||_s==="pausado"||_s==="negociacao")return;
    if(c.dataFim){ const dd=diasAte(c.dataFim);
      if(dd!=null && dd<0) list.push({sev:"crit",tipo:"Contrato vencido",cid:c.id,txt:`${c.cliente} · venceu ${brDate(c.dataFim)} (${-dd}d atrás)`});
      else if(dd!=null && dd<=15) list.push({sev:"warn",tipo:"Contrato vencendo",cid:c.id,txt:`${c.cliente} · vence ${brDate(c.dataFim)} (faltam ${dd}d)`}); }
    (c.etapas||[]).forEach(e=>{ if(!e.prazo||isDone(e.status))return; const dd=diasAte(e.prazo);
      if(dd!=null && dd<0) list.push({sev:"crit",tipo:"Etapa atrasada",cid:c.id,txt:`${c.cliente} · ${e.nome} (${-dd}d atrasada)`});
      else if(dd!=null && dd<=5) list.push({sev:"warn",tipo:"Etapa perto do prazo",cid:c.id,txt:`${c.cliente} · ${e.nome} (faltam ${dd}d)`}); });
    if(ROLE==="gestao"){ getFin(c).parcelas.forEach(p=>{ if(p.pago||!p.venc)return; const dd=diasAte(p.venc);
      if(dd!=null && dd<0) list.push({sev:"crit",tipo:"Parcela vencida",cid:c.id,txt:`${c.cliente} · ${p.label||"parcela"} ${fmt(p.valor)} venceu ${brDate(p.venc)}`});
      else if(dd!=null && dd<=7) list.push({sev:"warn",tipo:"Parcela a vencer",cid:c.id,txt:`${c.cliente} · ${p.label||"parcela"} ${fmt(p.valor)} vence ${brDate(p.venc)}`}); }); }
  });
  return list.sort((a,b)=> a.sev===b.sev?0:(a.sev==="crit"?-1:1));
}

/* ============================================================
   MOTOR FINANCEIRO GERENCIAL — despesas com vigência, cenários, projeção
   ============================================================ */
const FX_STORE_KEY="fortuna_fx";
let FX={scenario:"realista",horizon:12};
try{ const s=JSON.parse(localStorage.getItem(FX_STORE_KEY)||"{}"); FX={...FX,...s}; }catch(e){}
function fxSave(){ try{localStorage.setItem(FX_STORE_KEY,JSON.stringify(FX));}catch(e){} }
function caixaInicial(){ const v=APPCFG.caixa_inicial; if(v==null||v==="")return 0; if(typeof v==="number")return v; let s=String(v).trim(); if(s.indexOf(",")>=0){ s=s.replace(/\./g,"").replace(",","."); } const n=parseFloat(s); return isFinite(n)?n:0; }
function negProb(){ const v=+(APPCFG.neg_prob); return (isFinite(v)&&v>=0&&v<=100)?v:50; }
function ymOf(iso){ return iso?String(iso).slice(0,7):""; }
function ymOfDate(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); }
function fxAddMonths(base,k){ return new Date(base.getFullYear(),base.getMonth()+k,1); }
function contractWindow(c){
  let startYM=ymOf(c.dataInicio);
  if(!startYM){ const vs=getFin(c).parcelas.map(p=>p.venc).filter(Boolean).sort(); startYM=vs.length?ymOf(vs[0]):ymOfDate(new Date()); }
  let endYM=ymOf(c.dataFim);
  if(endYM && /-01$/.test(String(c.dataFim||""))){ const [Y,M]=endYM.split("-").map(Number); endYM=ymOfDate(new Date(Y,M-2,1)); } // dia 01 = termina no fim do mês anterior
  if(!endYM&&c.dataInicio&&c.prazoValor){ const di=parseISO(c.dataInicio);
    if(di&&!isNaN(di)){ const dias=c.prazoTipo==="dias"?(+c.prazoValor):0; const e = dias? new Date(di.getFullYear(),di.getMonth(),di.getDate()+dias) : new Date(di.getFullYear(),di.getMonth()+Math.max(0,(+c.prazoValor)-1),1); endYM=ymOfDate(e); } }
  return {startYM,endYM};
}
function ymInWindow(ym,s,e){ if(s&&ym<s)return false; if(e&&ym>e)return false; return true; }
function contractRevenueMonth(c,ym,{allowRecorr=true,firstYM=null}={}){
  const fin=getFin(c);
  const here=fin.parcelas.filter(p=>p.venc&&ymOf(p.venc)===ym);
  let r=0;
  if(here.length){ r+=here.filter(p=>!p.pago).reduce((s,p)=>s+(+p.valor||0),0); }   // parcela manda; pagas já estão no caixa
  else if(allowRecorr&&(+fin.valorMensal>0)){ const w=contractWindow(c); if(ymInWindow(ym,w.startYM,w.endYM)) r+=+fin.valorMensal; }
  if(firstYM&&ym===firstYM){ r+=fin.parcelas.filter(p=>!p.pago&&p.venc&&ymOf(p.venc)<firstYM).reduce((s,p)=>s+(+p.valor||0),0); } // atrasadas em aberto entram no 1º mês
  return r;
}
function contractsForScenario(){
  const firmes=DB.filter(c=>{const s=statusEfetivo(c);return s!=="pausado"&&s!=="negociacao"&&s!=="encerrado";});
  const neg=DB.filter(c=>statusEfetivo(c)==="negociacao");
  return {firmes,neg};
}
function receitaMes(ym,scenario,firstYM){
  const {firmes,neg}=contractsForScenario(); let r=0;
  const rec=scenario!=="conservador";
  firmes.forEach(c=>{ r+=contractRevenueMonth(c,ym,{allowRecorr:rec,firstYM}); });
  if(scenario==="otimista"){ const p=negProb()/100; neg.forEach(c=>{ r+=contractRevenueMonth(c,ym,{allowRecorr:true,firstYM})*p; }); }
  return r;
}
function despesasMes(ym,scenario){
  let total=0; const byCat={};
  const add=(cat,v)=>{ if(!v)return; total+=v; cat=cat||"Geral"; byCat[cat]=(byCat[cat]||0)+v; };
  DESP.forEach(d=>{ if(d.valor==null)return; const rec=(d.recorrencia||"mensal");
    if(rec==="unica"){ const mes=d.inicio||ymOfDate(new Date()); if(mes===ym) add(d.categoria,+d.valor); }
    else { const okS=!d.inicio||ym>=d.inicio, okE=!d.fim||ym<=d.fim; if(okS&&okE) add(d.categoria,+d.valor); } });
  const {firmes,neg}=contractsForScenario();
  firmes.forEach(c=>{ getFin(c).despesas.forEach(x=>{ if(x.data&&ymOf(x.data)===ym) add("Custos de projeto",+x.valor||0); }); });
  if(scenario==="otimista"){ const p=negProb()/100; neg.forEach(c=>{ getFin(c).despesas.forEach(x=>{ if(x.data&&ymOf(x.data)===ym) add("Custos de projeto",(+x.valor||0)*p); }); }); } // custo de negociacao ponderado igual a receita
  return {total,byCat};
}
function buildProjection(scenario,horizon){
  const base=new Date(); const b=new Date(base.getFullYear(),base.getMonth(),1);
  let acum=caixaInicial(); const rows=[];
  const firstYM=ymOfDate(b);
  for(let k=0;k<horizon;k++){ const d=fxAddMonths(b,k); const ym=ymOfDate(d);
    const receita=receitaMes(ym,scenario,firstYM); const dm=despesasMes(ym,scenario);
    const saldo=receita-dm.total; acum+=saldo;
    rows.push({ym,label:d.toLocaleDateString("pt-BR",{month:"short",year:"2-digit"}),receita,despesa:dm.total,byCat:dm.byCat,saldo,acum}); }
  return rows;
}
function projKpis(rows){
  const h=rows.length||1;
  const totRec=rows.reduce((s,r)=>s+r.receita,0), totDesp=rows.reduce((s,r)=>s+r.despesa,0);
  const resultado=totRec-totDesp, avgRec=totRec/h, avgDesp=totDesp/h;
  const margem=totRec>0?resultado/totRec*100:0;
  const minRow=rows.reduce((m,r)=>r.acum<m.acum?r:m,rows[0]||{acum:0,label:"—"});
  const melhor=rows.reduce((m,r)=>r.saldo>m.saldo?r:m,rows[0]||{saldo:0,label:"—"});
  const pior=rows.reduce((m,r)=>r.saldo<m.saldo?r:m,rows[0]||{saldo:0,label:"—"});
  let runway=null; for(const r of rows){ if(r.acum<0){ runway=r; break; } }
  return {totRec,totDesp,resultado,avgRec,avgDesp,margem,minRow,melhor,pior,runway,caixaIni:caixaInicial()};
}
/* --- gráficos SVG --- */
function svgBars(rows){
  const W=Math.max(560,rows.length*54),H=240,pl=8,pr=8,pt=20,pb=26;
  const maxV=Math.max(1,...rows.map(r=>Math.max(r.receita,r.despesa)));
  const iw=(W-pl-pr)/rows.length, bw=Math.min(15,iw/2-3);
  const y=v=>(H-pb)-(v/maxV)*(H-pt-pb);
  let g="";
  [0,0.5,1].forEach(t=>{ const yy=(H-pb)-t*(H-pt-pb); g+=`<line x1="${pl}" y1="${yy.toFixed(1)}" x2="${W-pr}" y2="${yy.toFixed(1)}" stroke="var(--line)" ${t?'stroke-dasharray="3 4"':""}/>`; });
  rows.forEach((r,i)=>{ const cx=pl+iw*i+iw/2, rx=cx-bw-2, dx=cx+2;
    g+=`<rect x="${rx.toFixed(1)}" y="${y(r.receita).toFixed(1)}" width="${bw.toFixed(1)}" height="${(H-pb-y(r.receita)).toFixed(1)}" rx="3" fill="var(--violet)"><title>${r.label} · receita ${fmt(r.receita)}</title></rect>`;
    g+=`<rect x="${dx.toFixed(1)}" y="${y(r.despesa).toFixed(1)}" width="${bw.toFixed(1)}" height="${(H-pb-y(r.despesa)).toFixed(1)}" rx="3" fill="var(--crit)"><title>${r.label} · despesa ${fmt(r.despesa)}</title></rect>`;
    g+=`<text x="${cx.toFixed(1)}" y="${H-9}" text-anchor="middle" font-size="10" fill="var(--ink-soft)">${r.label}</text>`; });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="xMinYMid meet" class="fxsvg">${g}</svg>`;
}
function svgSaldo(rows,caixaIni){
  const W=Math.max(560,rows.length*54),H=220,pl=8,pr=8,pt=16,pb=26;
  const pts=[{acum:caixaIni,label:"hoje"}].concat(rows.map(r=>({acum:r.acum,label:r.label})));
  const n=pts.length, vals=pts.map(p=>p.acum).concat([0]);
  let mn=Math.min(...vals), mx=Math.max(...vals); if(mn===mx)mx=mn+1;
  const px=i=>pl+(i/(n-1))*(W-pl-pr), py=v=>(H-pb)-((v-mn)/(mx-mn))*(H-pt-pb), zy=py(0);
  const line=pts.map((p,i)=>`${i?"L":"M"}${px(i).toFixed(1)} ${py(p.acum).toFixed(1)}`).join(" ");
  const area=`M${px(0).toFixed(1)} ${zy.toFixed(1)} `+pts.map((p,i)=>`L${px(i).toFixed(1)} ${py(p.acum).toFixed(1)}`).join(" ")+` L${px(n-1).toFixed(1)} ${zy.toFixed(1)} Z`;
  let g=`<defs><linearGradient id="fxg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--violet)" stop-opacity="0.28"/><stop offset="1" stop-color="var(--violet)" stop-opacity="0"/></linearGradient></defs>`;
  g+=`<line x1="${pl}" y1="${zy.toFixed(1)}" x2="${W-pr}" y2="${zy.toFixed(1)}" stroke="var(--line-strong)"/>`;
  g+=`<path d="${area}" fill="url(#fxg)"/><path d="${line}" fill="none" stroke="var(--violet)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  pts.forEach((p,i)=>{ g+=`<circle cx="${px(i).toFixed(1)}" cy="${py(p.acum).toFixed(1)}" r="${i===0?3.2:2.6}" fill="${p.acum<0?"var(--crit)":"var(--violet)"}"><title>${p.label} · ${fmt(p.acum)}</title></circle>`; });
  const step=Math.max(1,Math.ceil((n-1)/6));
  pts.forEach((p,i)=>{ if(i%step===0||i===n-1) g+=`<text x="${px(i).toFixed(1)}" y="${H-9}" text-anchor="middle" font-size="9.5" fill="var(--ink-soft)">${p.label}</text>`; });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="xMinYMid meet" class="fxsvg">${g}</svg>`;
}
function catAgg(rows){ const m={}; rows.forEach(r=>Object.entries(r.byCat||{}).forEach(([k,v])=>m[k]=(m[k]||0)+v)); return Object.entries(m).sort((a,b)=>b[1]-a[1]); }
function catBars(rows){
  const agg=catAgg(rows), tot=agg.reduce((s,x)=>s+x[1],0)||1;
  if(!agg.length) return '<div class="muted-note">Sem despesas no período.</div>';
  const pal=["var(--violet)","var(--crit)","var(--warn)","var(--info)","var(--ok)","var(--navy)"];
  return `<div class="catbars">`+agg.map(([k,v],i)=>{ const p=v/tot*100; return `<div class="catrow"><div class="catlab">${esc(k)}</div><div class="cattrack"><i style="width:${p.toFixed(1)}%;background:${pal[i%pal.length]}"></i></div><div class="catval mono">${fmt(v)} · ${p.toFixed(0)}%</div></div>`; }).join("")+`</div>`;

function classifyAgendaUrl(u){
  const s=(u||"").toLowerCase();

  if(s.includes("meet.google.com")||s.includes("zoom.us")||s.includes("teams.microsoft")||s.includes("meet.jit.si")) return "reuniao";
  if(s.includes("calendar.google.com/calendar/embed")||s.includes("calendar.google.com/calendar/u/")) return "agenda";
  if(s.includes("calendar.google.com")) return "agenda_dubia"; // link de agenda, mas talvez não seja o de incorporar
  return "outro";
}

function wireDespPanel(){

      const commit=async()=>{ const d=DESP.find(x=>x.id===id); if(!d)return; const f=inp.dataset.df;

function renderKpis(){
  const box=$("#kpis");const ativos=DB.filter(c=>{const s=statusEfetivo(c);return s!=="encerrado"&&s!=="negociacao"&&s!=="pausado";});
  const etTot=ativos.reduce((s,c)=>s+(c.etapas?.length||0),0);
  const etDone=ativos.reduce((s,c)=>s+(c.etapas?.filter(e=>isDone(e.status)).length||0),0);
  const kpi=(lab,val,sub,cls="",small=false,filter=null)=>`<div class="kpi ${cls}${filter?" kpi-click":""}${filter&&FILTER===filter?" active":""}" ${filter?`data-kpifilter="${filter}"`:""}><div class="lab">${lab}</div><div class="val ${small?'small':''}">${val}</div>${sub?`<div class="sub">${sub}</div>`:""}</div>`;
  const emNeg=DB.filter(c=>statusEfetivo(c)==="negociacao").length;
  let h="";
  h+=kpi("Contratos ativos",ativos.length,`${DB.length} no total`,"",false,"ativo");
  h+=kpi("Em negociação",emNeg,"no funil de fechamento","",false,"negociacao");
  h+=kpi("Etapas concluídas",`${etDone}<span style="font-size:14px;color:var(--ink-soft)">/${etTot}</span>`,"entregas marcadas");
  if(ROLE==="gestao"){
    const carteira=DB.filter(c=>{const s=statusEfetivo(c);return s!=="pausado"&&s!=="negociacao"&&s!=="encerrado";});
    const totC=carteira.reduce((s,c)=>s+getFin(c).valorTotal,0);
    const totMes=ativos.reduce((s,c)=>s+getFin(c).valorMensal,0);
    const totR=carteira.reduce((s,c)=>s+recebido(c),0);
    const totAR=carteira.reduce((s,c)=>s+aReceber(c),0);
    const despMes=despesasMes(ymOfDate(new Date()),"realista").total;
    h+=kpi("Total contratado",fmt(totC),"soma dos contratos","accent kpi-money",true);
    h+=kpi("Recorrência / mês",fmt(totMes),"MRR contratado (ativos)","kpi-money",true);
    h+=kpi("Despesas do mês",fmt(despMes),"custos do mês vigente · abrir aba","goview kpi-money",true);
    h+=kpi("Resultado / mês",fmt(totMes-despMes),"recorrência − custos do mês","kpi-money",true);
    h+=kpi("Recebido",fmt(totR),"parcelas pagas (carteira)","kpi-money",true);
    h+=kpi("A receber",fmt(totAR),"parcelas em aberto","kpi-money",true);
  }
  box.innerHTML=h;
  box.querySelectorAll("[data-kpifilter]").forEach(k=>k.onclick=()=>setFilter(k.dataset.kpifilter));
  box.querySelectorAll(".goview").forEach(k=>k.onclick=()=>switchView("financeiro"));
}
function setFilter(f){
  FILTER=(FILTER===f && f!=="todos")?"todos":f;   // clicar de novo no mesmo card volta pra Todos
  const seg=$("#filterSeg"); if(seg)seg.querySelectorAll("button").forEach(x=>x.classList.toggle("active",x.dataset.f===FILTER));

function switchView(v){

function cronoHtml(c){
  const ini=c.dataInicio, fim=c.dataFim;
  const comPrazo=(c.etapas||[]).filter(e=>e.prazo);
  if(!ini||!fim||!comPrazo.length)return "";
  const t0=parseISO(ini).getTime(), t1=parseISO(fim).getTime(), span=Math.max(1,t1-t0);
  const pct=iso=>{const p=parseISO(iso); if(!p||isNaN(p))return null; return Math.max(0,Math.min(100,((p.getTime()-t0)/span)*100));};
  const hoje=pct(todayISO());
  const congelado=["pausado","negociacao","encerrado"].includes(statusEfetivo(c));
  const marks=comPrazo.map(e=>{const x=pct(e.prazo); if(x==null)return ""; const st=isDone(e.status)?"entregue":((!congelado&&etapaAtrasada(e))?"atrasada":"pend"); return `<span class="cron-mk cron-${st}" style="left:${x}%" title="${esc(e.nome)} · ${brDate(e.prazo)}"></span>`;}).join("");

      <table class="tbl"><thead><tr><th>Parcela</th><th>Vencimento</th><th class="r">Valor</th><th class="r">Status</th></tr></thead>

    <div class="sec hide-team"><div class="h"><span>Despesas do contrato</span><span class="mono" style="color:var(--ink-soft)">Total ${fmt(despesaTotal(c))}</span></div>
      <table class="tbl"><thead><tr><th>Descrição</th><th>Data</th><th class="r">Valor</th><th class="r"></th></tr></thead>
      <tbody>${getFin(c).despesas.map((d,i)=>despRow(c,d,i)).join("")||'<tr><td colspan="4" style="color:var(--ink-soft)">Nenhuma despesa lançada.</td></tr>'}</tbody></table>
      <button class="add-mini" data-add-desp="${c.id}">+ Lançar despesa</button></div>`;
  }
  const cc=getCC(c), dr=getDrive(c);
  const acc=[];
  if(cc&&cc.url) acc.push(`<div class="cc-item"><a class="btn cc-open" href="${esc(cc.url)}" target="_blank" rel="noopener">🎛️ Abrir Command Center ↗</a>${cc.senha?`<span class="cc-pass">🔑 <code>${esc(cc.senha)}</code> <button class="linkbtn" type="button" data-cc-copy="${esc(cc.senha)}">copiar</button></span>`:""}</div>`);
  if(dr&&dr.url) acc.push(`<div class="cc-item"><a class="btn ghost cc-open" href="${esc(dr.url)}" target="_blank" rel="noopener">📁 Abrir Projeto no Drive ↗</a></div>`);
  const ccHtml = acc.length ? `<div class="sec"><div class="h">Acessos rápidos <span style="color:var(--ink-soft);font-weight:400;text-transform:none;letter-spacing:0">painel & arquivos do cliente</span></div>
    <div class="cc-box">${acc.join("")}</div></div>` : "";
  let docs="";
  if(ROLE==="gestao"){
    const ax=(c.anexos||[]).filter(a=>a&&a.tipo!=="cc"&&a.tipo!=="drive");
    docs=`<div class="sec hide-team"><div class="h">Documentos / anexos <span style="color:var(--ink-soft);font-weight:400;text-transform:none;letter-spacing:0">visível só na Gestão</span></div>
      ${ax.length?`<div class="anexos">${ax.map(a=>`<a class="anexo" href="${esc(a.url)}" target="_blank" rel="noopener">📎 <span>${esc(a.nome||"arquivo")}</span></a>`).join("")}</div>`:'<div class="scope">Nenhum anexo. Edite o contrato para adicionar links.</div>'}</div>`;
  }
  const obs=(c.obs&&ROLE==="gestao")?`<div class="sec hide-team"><div class="h">Observações</div><div class="scope">${esc(c.obs)}</div></div>`:"";
  const actions=ROLE==="gestao"?`<div class="row-actions hide-team">
      <button class="btn ghost sm" data-toggletipo="${c.id}">${c.soProjeto?"➡️ Transformar em contrato ativo":"➡️ Transformar em projeto"}</button>
      <button class="btn ghost sm" data-edit="${c.id}">✏️ Editar</button>
      <button class="btn ghost sm" data-dup="${c.id}">Duplicar</button>
      <button class="btn danger sm" data-del="${c.id}">Excluir</button></div>`:"";
  return meta+etapas+cronoHtml(c)+ccHtml+escopo+fin+docs+obs+actions;
}
function findC(id){ return DB.find(x=>x.id===id) || PROJ_ONLY.find(x=>x.id===id) || null; } // contrato OU projeto
function getCC(c){ return (c.anexos||[]).find(a=>a&&a.tipo==="cc")||null; }
function getDrive(c){ return (c.anexos||[]).find(a=>a&&a.tipo==="drive")||null; }
function respList(e){ return Array.isArray(e.resps)?e.resps:(e.resp?[e.resp]:[]); }
function stageRow(c,e,i){
  const done=isDone(e.status);
  const resps=respList(e);
  let respHtml;
  if(ROLE==="gestao"){
    const chips=resps.map(r=>`<span class="resp-chip">${esc(r)}<button class="rx" data-respdel="${c.id}:${i}:${esc(r)}" title="remover">×</button></span>`).join("");
    const opts=MEMBROS.filter(m=>!resps.includes(m.nome)).map(m=>`<option value="${esc(m.nome)}">${esc(m.nome)}</option>`).join("");
    respHtml=`<span class="resp-wrap">${chips}<select class="st-select resp-add" data-respadd="${c.id}:${i}"><option value="">+ responsável</option>${opts}</select></span>`;
  } else {
    respHtml=resps.length?`<span class="resp-wrap">${resps.map(r=>`<span class="resp-chip">👤 ${esc(r)}</span>`).join("")}</span>`:`<span class="resp-chip vazio">sem responsável</span>`;
  }
  let chip="";
  if(e.prazo){ const dd=diasAte(e.prazo); const congelado=["pausado","negociacao","encerrado"].includes(statusEfetivo(c));
    const cls=done?"praz-done":(congelado?"praz-ok":(dd<0?"praz-late":(dd<=5?"praz-soon":"praz-ok")));
    const txt=(done||congelado)?brDate(e.prazo):(dd<0?`atrasada ${-dd}d`:(dd===0?"vence hoje":`faltam ${dd}d`));
    chip=`<span class="praz ${cls}" title="Prazo: ${brDate(e.prazo)}">📅 ${txt}</span>`; }
  const prazoHtml = ROLE==="gestao"
    ? `<span class="prazo-edit">${chip}<input type="date" class="st-prazo" data-prazo="${c.id}:${i}" value="${e.prazo||""}" title="Definir prazo desta demanda">${e.prazo?`<button class="praz-x" data-prazoclr="${c.id}:${i}" title="Limpar prazo">×</button>`:""}</span>`
    : (chip||`<span class="praz praz-ok" style="opacity:.6">sem prazo</span>`);
  const nc=(e.coments||[]).length;
  const cmtHtml=`<button class="cmt-btn ${nc?"tem":""}" data-cmt="${c.id}:${i}" title="Comentários da etapa">💬 ${nc}</button>`;
  return `<div class="stage ${done?'done':''}"><span class="st-dot dot-${e.status}"></span><span class="name">${esc(e.nome)}</span>${prazoHtml}${respHtml}${cmtHtml}<select class="st-select" data-stage="${c.id}:${i}">${STAGE_STATES.map(s=>`<option value="${s.v}" ${s.v===e.status?"selected":""}>${s.t}</option>`).join("")}</select></div>`;
}
function parcelaRow(c,p,i){const t=todayISO(),venc=!p.pago&&p.venc&&p.venc<t;const tag=p.pago?`<span class="pay-tag pago">Pago</span>`:venc?`<span class="pay-tag venc">Vencido</span>`:`<span class="pay-tag aberto">Em aberto</span>`;
  return `<tr><td>${esc(p.label||("Parcela "+(i+1)))}</td><td>${brDate(p.venc)}</td><td class="r mono">${fmt(p.valor)}</td><td class="r">${tag} <button class="link" data-pay="${c.id}:${i}">${p.pago?"desmarcar":"marcar pago"}</button>${!p.pago?` · <button class="link" data-cob="${c.id}:${i}">cobrar</button>`:""}</td></tr>`;}
function despRow(c,d,i){return `<tr><td>${esc(d.desc||"—")}</td><td>${brDate(d.data)}</td><td class="r mono">${fmt(d.valor)}</td><td class="r"><button class="link" style="color:var(--crit)" data-deldesp="${c.id}:${i}">remover</button></td></tr>`;}

function wireBody(el,c){
  el.querySelectorAll("[data-cc-copy]").forEach(b=>b.onclick=ev=>{ev.stopPropagation(); const s=b.dataset.ccCopy; try{navigator.clipboard.writeText(s); toast("Senha copiada");}catch(e){ toast("Copie manual: "+s); }});
  el.querySelectorAll("[data-stage]").forEach(sel=>sel.onchange=async ev=>{ev.stopPropagation();
    const [id,i]=sel.dataset.stage.split(":");const ct=findC(id);ct.etapas[+i].status=sel.value;
    try{await Store.patchContract(ct);softRefresh(id);renderKpis();}catch(e){toast("Erro ao salvar etapa",true);}});
  el.querySelectorAll("[data-prazo]").forEach(inp=>inp.onchange=async ev=>{ev.stopPropagation();
    const [id,i]=inp.dataset.prazo.split(":");const ct=findC(id);
    if(inp.value)ct.etapas[+i].prazo=inp.value; else delete ct.etapas[+i].prazo;
    try{await Store.patchContract(ct);softRefresh(id);renderAlertas();}catch(err){toast("Erro ao salvar prazo",true);}});
  el.querySelectorAll("[data-prazoclr]").forEach(b=>b.onclick=async ev=>{ev.stopPropagation();
    const [id,i]=b.dataset.prazoclr.split(":");const ct=findC(id);delete ct.etapas[+i].prazo;
    try{await Store.patchContract(ct);softRefresh(id);renderAlertas();}catch(err){toast("Erro ao limpar prazo",true);}});
  el.querySelectorAll("[data-cmt]").forEach(b=>b.onclick=ev=>{ev.stopPropagation();const[id,i]=b.dataset.cmt.split(":");comentariosModal(id,+i);});
  el.querySelectorAll("[data-cob]").forEach(b=>b.onclick=ev=>{ev.stopPropagation();const[id,i]=b.dataset.cob.split(":");cobrancaModal(id,+i);});
  el.querySelectorAll("[data-respadd]").forEach(sel=>sel.onchange=async ev=>{ev.stopPropagation();
    const v=sel.value; if(!v)return;
    const [id,i]=sel.dataset.respadd.split(":");const ct=findC(id);const e=ct.etapas[+i];
    const arr=respList(e); if(arr.includes(v)){return;} arr.push(v); e.resps=arr; delete e.resp;
    try{await Store.patchContract(ct);await Store.criarNotif(v,ct,e.nome);softRefresh(id);renderBell();toast(v+" foi notificado da atribuição");}catch(err){toast("Erro ao salvar responsável",true);}});
  el.querySelectorAll("[data-respdel]").forEach(b=>b.onclick=async ev=>{ev.stopPropagation();
    const parts=b.dataset.respdel.split(":");const id=parts[0],i=parts[1],nome=parts.slice(2).join(":");
    const ct=findC(id);const e=ct.etapas[+i];
    e.resps=respList(e).filter(r=>r!==nome); delete e.resp;
    try{await Store.patchContract(ct);softRefresh(id);}catch(err){toast("Erro ao remover responsável",true);}});
  el.querySelectorAll("[data-auto]").forEach(chk=>chk.onchange=async ev=>{ev.stopPropagation();
    const ct=findC(chk.dataset.auto);ct.autoProgresso=chk.checked;if(chk.checked)ct.progressoManual=null;else if(ct.progressoManual==null)ct.progressoManual=progress(ct);
    try{await Store.patchContract(ct);softRefresh(ct.id);renderKpis();}catch(e){toast("Erro ao salvar",true);}});
  el.querySelectorAll("[data-range]").forEach(rg=>{
    rg.oninput=ev=>{ev.stopPropagation();const pct=rg.parentElement.querySelector(".pct");if(pct)pct.textContent=rg.value+"%";const bar=el.querySelector(".bar > i");if(bar)bar.style.width=rg.value+"%";};
    rg.onchange=async ev=>{ev.stopPropagation();const ct=findC(rg.dataset.range);ct.autoProgresso=false;ct.progressoManual=+rg.value;
      try{await Store.patchContract(ct);softRefresh(ct.id);renderKpis();}catch(e){toast("Erro ao salvar progresso",true);}};
  });
  el.querySelectorAll("[data-pay]").forEach(b=>b.onclick=async ev=>{ev.stopPropagation();const[id,i]=b.dataset.pay.split(":");const ct=findC(id);
    ct.fin.parcelas[+i].pago=!ct.fin.parcelas[+i].pago;try{await Store.saveFin(ct);softRefresh(id);renderKpis();}catch(e){toast("Erro ao salvar pagamento",true);}});
  el.querySelectorAll("[data-deldesp]").forEach(b=>b.onclick=async ev=>{ev.stopPropagation();const[id,i]=b.dataset.deldesp.split(":");const ct=findC(id);
    ct.fin.despesas.splice(+i,1);try{await Store.saveFin(ct);softRefresh(id);renderKpis();}catch(e){toast("Erro ao remover",true);}});
  const addD=el.querySelector("[data-add-desp]");if(addD)addD.onclick=ev=>{ev.stopPropagation();despesaModal(c.id);};
  const ed=el.querySelector("[data-edit]");if(ed)ed.onclick=ev=>{ev.stopPropagation();contractModal(c.id);};
  const dp=el.querySelector("[data-dup]");if(dp)dp.onclick=async ev=>{ev.stopPropagation();const copy=JSON.parse(JSON.stringify(c));copy.id=uid();copy.cliente=c.cliente+" (cópia)";
    try{await Store.saveContract(copy,{withFin:true});render();toast("Contrato duplicado");}catch(e){toast("Erro ao duplicar",true);}};
  const dl=el.querySelector("[data-del]");if(dl)dl.onclick=async ev=>{ev.stopPropagation();if(confirm('Excluir o contrato "'+c.cliente+'"? Esta ação não pode ser desfeita.')){
    try{await Store.remove(c.id);document.querySelectorAll(".modal-bg[data-det]").forEach(m=>m.remove());render();toast("Contrato excluído");}catch(e){toast("Erro ao excluir",true);}}};
  const tt=el.querySelector("[data-toggletipo]");if(tt)tt.onclick=async ev=>{ev.stopPropagation();
    const ct=findC(c.id); if(!ct)return;
    const virandoContrato=!!ct.soProjeto;
    const msg=virandoContrato ? 'Transformar "'+ct.cliente+'" em CONTRATO ATIVO? Passa a contar nos KPIs e no fluxo de caixa.' : 'Transformar "'+ct.cliente+'" em PROJETO? Sai dos contratos e dos KPIs/fluxo (vai só pra aba Projetos).';
    if(!confirm(msg))return;
    ct.soProjeto=!ct.soProjeto; if(!ct.soProjeto) ct.status="ativo"; // virou contrato -> ativo (exclusivo: nunca os dois)
    try{ await Store.saveContract(ct); document.querySelectorAll(".modal-bg[data-det]").forEach(m=>m.remove()); render(); if(VIEW==="projetos")renderProjetos(); renderKpis(); toast(virandoContrato?"Agora é contrato ativo ✓":"Agora é projeto ✓"); }
    catch(e){ toast("Erro ao transformar: "+(e.message||""),true); } };
  const as=el.querySelector("[data-addstage]");if(as)as.onclick=async ev=>{ev.stopPropagation();
    const nome=(prompt("Nome da nova etapa / entrega:")||"").trim(); if(!nome)return;
    const ct=findC(c.id); if(!ct)return; ct.etapas=ct.etapas||[]; ct.etapas.push({nome,status:"pendente",resps:[],coments:[]});
    try{ await Store.patchContract(ct); el.innerHTML=bodyHtml(ct); wireBody(el,ct); renderKpis(); renderList(); if(VIEW==="projetos")renderProjetos(); toast("Etapa adicionada"); }
    catch(e){ toast("Erro ao adicionar etapa",true); } };
}
function softRefresh(id){
  const c=findC(id); if(!c)return;
  const old=document.querySelector(`.ccard[data-id="${id}"]`);
  if(old)old.replaceWith(cardEl(c));
  const det=document.querySelector(`.modal-bg[data-det="${id}"]`);
  if(det){
    const body=det.querySelector("#detBody");
    if(body){ body.innerHTML=bodyHtml(c); wireBody(body,c); }
    const h=det.querySelector(".modal-head h2");
    if(h)h.innerHTML=`${esc(c.cliente)} <span class="chip ${chipCls(c)}">${STATUS_LABEL[statusEfetivo(c)]||""}</span>`;
  }
}

function contractModal(id){
  const editing=!!id;
  const c=editing?JSON.parse(JSON.stringify(findC(id))):{id:uid(),cliente:"",razao:"",cnpj:"",rep:"",telefone:"",status:"ativo",dataInicio:todayISO(),dataFim:"",dataAssinatura:todayISO(),prazoTipo:"meses",prazoValor:"",autoProgresso:true,progressoManual:null,escopo:"",obs:"",etapas:[],anexos:[],fin:{valorTotal:"",valorMensal:"",parcelas:[],despesas:[]}};
  if(!c.fin)c.fin={valorTotal:"",valorMensal:"",parcelas:[],despesas:[]};
  if(!c.anexos)c.anexos=[];
  const m=document.createElement("div");m.className="modal-bg";
  m.innerHTML=`<div class="modal"><div class="modal-head"><h2>${editing?"Editar contrato":"Novo contrato"}</h2><button class="close-x" data-x>×</button></div>
    <div class="modal-body">

      <div class="field-row"><div class="field"><label>Responsável / contato</label><input id="f-rep" value="${esc(c.rep)}"></div>
        <div class="field"><label>WhatsApp do cliente <span style="font-weight:400;color:var(--ink-soft)">(cobrança)</span></label><input id="f-tel" value="${esc(c.telefone||"")}" placeholder="(11) 90000-0000" inputmode="tel"></div></div>
      <div class="field-row">
        <div class="field"><label>Status</label><select id="f-status">${["ativo","negociacao","pausado","encerrado"].map(s=>`<option value="${s}" ${c.status===s?"selected":""}>${STATUS_LABEL[s]}</option>`).join("")}</select></div>
        <div class="field"><label>Classificação</label><label class="toggle" style="margin-top:9px"><span class="switch"><input type="checkbox" id="f-soproj" ${c.soProjeto?"checked":""}><span class="sl"></span></span> É <b>projeto</b> (aparece só na aba Projetos, fora dos contratos/KPIs)</label></div></div>
      <div class="field-row three"><div class="field"><label>Data de início</label><input type="date" id="f-ini" value="${c.dataInicio||""}"></div>

        <div class="field"><label>Valor total (R$)</label><input type="number" step="0.01" id="f-valor" value="${c.fin.valorTotal}"></div></div>

  $("#modalMount").appendChild(m);

  const drawAnex=()=>{ anexWrap.innerHTML=c.anexos.map((a,i)=>`<div class="dyn-row" style="grid-template-columns:1fr 1.4fr 30px"><input value="${esc(a.nome)}" data-an="${i}" placeholder="Nome (ex.: Dossiê Dingo)"><input value="${esc(a.url)}" data-au="${i}" placeholder="https://link-do-arquivo"><button class="icon-btn" type="button" data-ra="${i}">🗑</button></div>`).join(""); wireDyn(); };
  const drawStages=()=>{stagesWrap.innerHTML=c.etapas.map((e,i)=>`<div class="dyn-row stage-row"><input value="${esc(e.nome)}" data-sn="${i}" placeholder="Nome da etapa"><input type="date" value="${e.prazo||""}" data-sp="${i}" title="Prazo da etapa"><select data-ss="${i}">${STAGE_STATES.map(s=>`<option value="${s.v}" ${s.v===e.status?"selected":""}>${s.t}</option>`).join("")}</select><button class="icon-btn" type="button" data-rs="${i}">🗑</button></div>`).join("");wireDyn();};

  function wireDyn(){
    stagesWrap.querySelectorAll("[data-sn]").forEach(el=>el.oninput=()=>c.etapas[+el.dataset.sn].nome=el.value);
    stagesWrap.querySelectorAll("[data-ss]").forEach(el=>el.onchange=()=>c.etapas[+el.dataset.ss].status=el.value);
    stagesWrap.querySelectorAll("[data-sp]").forEach(el=>el.onchange=()=>c.etapas[+el.dataset.sp].prazo=el.value);

    parcWrap.querySelectorAll("[data-pn]").forEach(el=>el.oninput=()=>c.fin.parcelas[+el.dataset.pn].label=el.value);

  }

  m.querySelector("#addParc").onclick=()=>{c.fin.parcelas.push({label:(c.fin.parcelas.length+1)+"ª parcela",valor:"",venc:"",pago:false});drawParc();};
  m.querySelector("#addAnex").onclick=()=>{c.anexos.push({nome:"",url:""});drawAnex();};
  m.querySelector("#genParc").onclick=()=>{const total=+m.querySelector("#f-valor").value||0;const n=parseInt(prompt("Quantas parcelas?","4"),10);if(!n||n<1)return;const ini=m.querySelector("#f-ini").value||m.querySelector("#f-ass").value||todayISO();const each=Math.round(total/n*100)/100;c.fin.parcelas=Array.from({length:n},(_,i)=>({label:(i+1)+"ª parcela",valor:each,venc:addMonths(ini,i),pago:false}));drawParc();};
  m.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>m.remove());

    c.status=m.querySelector("#f-status").value;
    { const sp=m.querySelector("#f-soproj"); if(sp)c.soProjeto=sp.checked; }
    c.dataInicio=m.querySelector("#f-ini").value;c.dataFim=m.querySelector("#f-fim").value;c.dataAssinatura=m.querySelector("#f-ass").value;
    c.prazoValor=m.querySelector("#f-prazoV").value;c.prazoTipo=m.querySelector("#f-prazoT").value;

    { const ccurl=(m.querySelector("#f-ccurl").value||"").trim(); const ccsenha=(m.querySelector("#f-ccsenha").value||"").trim();

function resumoModal(){
  const hoje=new Date();
  const operacionais=DB.filter(c=>{const s=statusEfetivo(c);return s!=="encerrado"&&s!=="negociacao"&&s!=="pausado";});
  const ativos=operacionais;
  const emNeg=DB.filter(c=>statusEfetivo(c)==="negociacao").length;
  const etTot=operacionais.reduce((s,c)=>s+(c.etapas?.length||0),0);
  const etDone=operacionais.reduce((s,c)=>s+(c.etapas?.filter(e=>isDone(e.status)).length||0),0);
  const atrasadas=[],prox=[];
  operacionais.forEach(c=>{
    (c.etapas||[]).forEach(e=>{ if(!e.prazo||isDone(e.status))return; const dd=diasAte(e.prazo); const resp=respList(e).join(", ")||"sem responsável";
      if(dd<0)atrasadas.push(`- ${c.cliente}: ${e.nome} (${-dd} dias em atraso, com ${resp})`);
      else if(dd<=7)prox.push(`- ${c.cliente}: ${e.nome} (vence ${brDate(e.prazo)}, com ${resp})`); }); });
  let t=`Resumo da semana, ${hoje.toLocaleDateString("pt-BR")}\n\n`;
  t+=`Contratos ativos: ${ativos.length}\n`;
  if(emNeg)t+=`Em negociação: ${emNeg}\n`;
  t+=`Entregas concluídas: ${etDone} de ${etTot}\n\n`;
  t+= atrasadas.length ? `ATRASADAS (${atrasadas.length}):\n${atrasadas.join("\n")}\n\n` : `Nenhuma etapa atrasada. Time no prazo.\n\n`;
  t+= prox.length ? `VENCE NOS PRÓXIMOS 7 DIAS (${prox.length}):\n${prox.join("\n")}\n\n` : `Nada vencendo nos próximos 7 dias.\n\n`;
  t+=`Painel: https://riksonmiguellz.github.io/controle-contratos/`;
  textoModal("Resumo da semana","Texto pronto para colar no grupo. Só operacional, sem valores.",t);
}
function cobrancaModal(cid,pi){
  const c=findC(cid); if(!c)return;

  const dd=diasAte(p.venc), nome=c.rep||c.cliente, parc=p.label||"parcela";
  let msg;
  if(dd>=0){
    msg=`Olá, ${nome}, tudo bem?\n\nPassando para lembrar que a ${parc} do nosso contrato, no valor de ${fmt(p.valor)}, vence em ${brDate(p.venc)}.\n\nQualquer dúvida sobre o pagamento, é só me chamar por aqui.\n\nAbraço,\nFortuna AI Advisors`;
  }else if(-dd<=7){
    msg=`Olá, ${nome}, tudo bem?\n\nA ${parc} no valor de ${fmt(p.valor)}, com vencimento em ${brDate(p.venc)}, ainda consta em aberto por aqui.\n\nSe o pagamento já tiver sido feito, pode desconsiderar e me mandar o comprovante. Se preferir, reenvio os dados agora.\n\nAbraço,\nFortuna AI Advisors`;

  }

/* ---------- fundo animado (rede tech/IA) na tela de acesso ---------- */
window.BGFX=(function(){
  const canvas=$("#bgfx"); if(!canvas)return {start(){},stop(){}};
  const ctx=canvas.getContext("2d");
  const DPR=Math.min(window.devicePixelRatio||1,2);
  const TAU=6.2831853;
  let W=0,H=0,nodes=[],pulses=[],raf=null,running=false;
  const reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;
  function resize(){const r=canvas.getBoundingClientRect();W=canvas.width=Math.max(1,Math.round(r.width*DPR));H=canvas.height=Math.max(1,Math.round(r.height*DPR));}
  function build(){resize();const count=Math.max(20,Math.min(52,Math.floor((W*H)/(38000*DPR))));
    nodes=Array.from({length:count},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*0.16*DPR,vy:(Math.random()-.5)*0.16*DPR,r:(Math.random()*1.5+0.7)*DPR}));pulses=[];}
  const MAXD=()=>150*DPR;
  function spawnPulse(){if(pulses.length>10||!nodes.length)return;const i=(Math.random()*nodes.length)|0,a=nodes[i];let best=-1,bd=MAXD();
    for(let j=0;j<nodes.length;j++){if(j===i)continue;const b=nodes[j],d=Math.hypot(a.x-b.x,a.y-b.y);if(d<bd){bd=d;best=j;}}
    if(best>=0)pulses.push({a:i,b:best,t:0,sp:0.008+Math.random()*0.013});}
  function frame(){
    ctx.clearRect(0,0,W,H);
    for(const n of nodes){n.x+=n.vx;n.y+=n.vy;if(n.x<0||n.x>W)n.vx*=-1;if(n.y<0||n.y>H)n.vy*=-1;}
    const md=MAXD();
    for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){const a=nodes[i],b=nodes[j],d=Math.hypot(a.x-b.x,a.y-b.y);
      if(d<md){const o=1-d/md;ctx.strokeStyle="rgba(109,59,245,"+(o*0.26)+")";ctx.lineWidth=DPR*0.8;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();}}
    for(const n of nodes){const g=ctx.createRadialGradient(n.x,n.y,0,n.x,n.y,n.r*6);g.addColorStop(0,"rgba(124,77,255,0.34)");g.addColorStop(1,"rgba(124,77,255,0)");ctx.fillStyle=g;ctx.beginPath();ctx.arc(n.x,n.y,n.r*6,0,TAU);ctx.fill();
      ctx.fillStyle="rgba(109,59,245,0.85)";ctx.beginPath();ctx.arc(n.x,n.y,n.r,0,TAU);ctx.fill();}
    for(let k=pulses.length-1;k>=0;k--){const p=pulses[k];p.t+=p.sp;const a=nodes[p.a],b=nodes[p.b];if(!a||!b||p.t>=1){pulses.splice(k,1);continue;}
      const x=a.x+(b.x-a.x)*p.t,y=a.y+(b.y-a.y)*p.t,g=ctx.createRadialGradient(x,y,0,x,y,5.5*DPR);g.addColorStop(0,"rgba(46,123,196,0.95)");g.addColorStop(1,"rgba(46,123,196,0)");ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,5.5*DPR,0,TAU);ctx.fill();}
    if(Math.random()<0.06)spawnPulse();
    raf=requestAnimationFrame(frame);
  }
  function start(){if(running)return;running=true;build();frame();if(reduce){running=false;if(raf){cancelAnimationFrame(raf);raf=null;}}}
  function stop(){running=false;if(raf){cancelAnimationFrame(raf);raf=null;}}
  let rt=null;window.addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(()=>{if(running){build();}},200);});
  return {start,stop};
})();

(async function boot(){
  refreshModeUI();
  try{ window.BGFX.start(); }catch(e){}
  window.addEventListener("online",updateCloud);
  window.addEventListener("offline",updateCloud);
  try{ await Store.init(); }
  catch(e){ $("#gateErr").textContent="Aviso: "+(e.message||"falha ao conectar. Verifique a configuração do Supabase."); }
  if(!CLOUD)CONNECTED=true;
  renderGateTeam(); updateCloud();

  renderGateUser();
  if(CLOUD && SESSION){ try{ const role=await Store.resolvePapel(); enterUI(role); }catch(e){} }
})();
